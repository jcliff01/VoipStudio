name: Check the command-line tool

# Checks that vsx (the command-line analyzer) starts and analyzes a made-up sample call on Windows.
# It is Windows only: on macOS and Linux it starts, but analysis calls Windows' kernel32 and fails.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vsx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run vsx --help
        shell: bash
        run: dotnet vsx.dll --help
      # The built-in --selftest needs test captures that aren't in this repository, so it isn't run
      # here. Instead, analyze a tiny made-up call and check that vsx finds it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make a sample call capture
        shell: bash
        run: |
          python -m pip install --quiet scapy
          python .github/sample/make_pcap.py call.pcap
      - name: Analyze it
        shell: bash
        run: |
          dotnet vsx.dll analyze call.pcap --calls-csv calls.csv
          echo "--- calls.csv"; cat calls.csv
          test "$(wc -l < calls.csv)" -ge 2
